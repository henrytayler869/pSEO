# IP THẬT của khách, thay vì IP của Cloudflare.
#
# Bật lúc: 2026-09-20T14:54:25Z
#
# Trước mốc này, cột IP trong access.log là IP Cloudflare (172.64.0.0/13,
# 172.71.x…) cho MỌI khách. Sau mốc này nó là IP khách thật. Cùng một cột,
# hai ý nghĩa — access.log có một dòng đánh dấu tại đúng thời điểm chuyển,
# vì người quét log không có lý do gì đi tìm một commit.
#
# Vì sao cần: Cloudflare proxy nên origin chỉ thấy IP Cloudflare, và mọi
# thứ đi qua đó trông giống hệt nhau. Ngày 17/9/2026 một máy quét ở
# 154.58.229.28 giả danh Googlebot đi dò /.env, /.aws/config — bắt được
# CHỈ vì nó gọi thẳng origin. Thứ nào biết gọi qua Cloudflare thì không
# phân biệt nổi với Google thật. Header CF-Connecting-IP trả lại IP thật,
# đối chiếu được với dải IP công bố của Google.
#
# KHÔNG BAO GIỜ dùng set_real_ip_from 0.0.0.0/0. Nó không phải mất tác
# dụng — nó sai tự tin hơn: bất kỳ ai cũng đặt được CF-Connecting-IP:
# 66.249.66.1 và log sẽ ghi họ là Googlebot, tức đầu độc đúng phép xác
# minh dựng lên để có.
#
# Danh sách lấy SỐNG từ cloudflare.com/ips-v4 và ips-v6 lúc bật: 15 + 7
# dải. Cloudflare đổi dải thì đây cũ đi, và kiểu hỏng là IM LẶNG — dải
# thiếu thì request từ đó giữ nguyên IP Cloudflare, log thành nửa đúng
# nửa sai mà không gì báo. Phiên phân tích GSC/GA4 đối chiếu lại ở hai
# mốc 26/9 và 3/10/2026.

