name: CI + Deploy

# Push to main = deploy, but only after the gates pass. The deploy job depends
# on the ci job, so a red build never reaches the VPS.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy without pushing an empty commit.
  workflow_dispatch:

# One deploy at a time. The VPS updates a single checkout in place, so two
# overlapping runs would git-reset the same working tree from under each other
# and leave /opt/pseo at neither commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The migrations are hand-written SQL and the
    # build touches Prisma — running them against nothing would test nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pseo
          POSTGRES_PASSWORD: pseo
          POSTGRES_DB: pseo_control_panel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pseo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pseo:pseo@localhost:5432/pseo_control_panel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Pinned to the version the VPS runs, so npm ci here is the SAME operation
      # it will be there. The lockfile currently installs cleanly on both
      # 10.9.8 and 11.6.2 (checked in Docker), but "currently" is not a
      # guarantee, and a lockfile that resolves differently on the build
      # machine than on the server is a class of bug worth closing rather than
      # re-testing.
      - name: Ghim npm khớp VPS
        run: npm i -g npm@11.6.2

      - run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Áp migration lên DB sạch
        # Proves the migration chain applies from zero. A migration that only
        # works against a database that already has the previous state by
        # accident fails here rather than on the VPS.
        run: npx prisma migrate deploy

      # Build comes BEFORE typecheck, which reads backwards and is correct.
      # Next 16 GENERATES the types for route handlers and layouts
      # (`RouteContext`, `LayoutProps`) during the build, into .next/types. A
      # clean checkout has no .next, so typecheck-first fails on four files
      # with "Cannot find name 'RouteContext'" — while passing on any machine
      # that happens to have built once. That is a green local check standing
      # on a build artefact nobody declared a dependency on.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test — luật đổi mật khẩu
        # Pure, no data needed. The branch that matters is "current password
        # required and must verify": if it ever inverted, a session would
        # silently become permanent ownership of the account and nothing about
        # the UI would look different.
        run: npx tsx scripts/test-password-change.ts

      - name: Test — luật xác thực dữ liệu
        # Pure functions, no data needed. Proves each collector rule can fire
        # AND stay quiet, and that an empty snapshot is refused.
        run: npx tsx scripts/test-validation-rules.ts

      # NOT run here: test-ai-validator.ts and scan-generated-copy.ts. Both
      # assert against REAL collected data and real generated copy, which a
      # blank CI database does not have. Running them against an empty
      # database would report green while checking nothing — the exact failure
      # this project keeps finding. They stay as commands to run against the
      # live database instead of a gate that lies.

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key is PINNED from a secret rather than accepted on first
          # sight. Trust-on-first-use in a pipeline means a run that happens
          # during a MITM silently trusts the attacker for every run after.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # No tarball, no scp: the VPS already holds a READ-ONLY GitHub deploy key
      # and fetches the commit itself. One code-transfer mechanism instead of
      # two, and CI needs no write access to anything on the server beyond
      # running one script.
      #
      # The script is streamed rather than stored on the box, so what runs is
      # always the version in this commit — a deploy script living on the
      # server drifts from the repo silently.
      - name: Chạy deploy trên VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes \
            "$USER_NAME@$HOST" "bash -s -- $GITHUB_SHA" < deploy/deploy.sh
