name: PR gates

# Chặn TRƯỚC khi vào main, thay vì báo sau khi đã vào.
#
# Vì sao cần thêm file này khi đã có "CI + Deploy": workflow kia chỉ chạy
# `on: push: branches: [main]`. Nghĩa là một PR merge được với 0 check, và máy
# chỉ kiểm SAU khi code đã nằm trên main. Repo này có bốn session cùng đẩy vào
# một nhánh, và `deploy` thì `needs: ci` — nên một commit đỏ không chỉ đỏ, nó
# chặn deploy của tất cả những người còn lại cho tới khi ai đó sửa.
#
# Đã xảy ra hai lần, và cả hai lần đều là cổng TĨNH bắt được:
#   a0d76c7  "tôi push dù tsc đã báo lỗi"
#   7e5d191  eslint đỏ vì `any` trong file bị quét nhầm vào commit
#
# Nên file này cố tình KHÔNG phải bản sao của pipeline chính.
#
# CÁI NÓ KHÔNG CHẠY, và vì sao:
#
# Không có Postgres, không `migrate deploy`, không `next build`, không mấy
# script test đọc dữ liệu thật. Chúng cần một DB có dữ liệu, và chạy chúng với
# DB rỗng sẽ báo xanh trong khi không kiểm gì — đúng thứ workflow kia đã ghi rõ
# ở khối "NOT run here". Một cổng nói dối còn tệ hơn không có cổng, vì nó tiêu
# luôn sự chú ý mà lẽ ra dành cho cổng thật.
#
# Pipeline đầy đủ vẫn chạy khi commit vào main. File này chỉ bảo đảm thứ vào
# main không đỏ vì lý do có thể biết trước mà không cần DB.
on:
  pull_request:
    branches: [main]

# KHÔNG dùng chung nhóm với `deploy-production`. Nhóm đó cố ý không huỷ job cũ
# (VPS chỉ có một checkout), nên nếu PR chen vào đó thì mỗi PR phải xếp hàng
# sau một lần deploy production — và bốn session mở PR sẽ nối đuôi nhau. Ở đây
# thì ngược lại: push mới vào cùng PR nên huỷ lượt cũ, vì kết quả của lượt cũ
# đã không còn nói về đầu nhánh nữa.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest

    # Postgres RỖNG, và "rỗng" ở đây là một lựa chọn đã được đo chứ không phải
    # một sự tiện tay.
    #
    # verify-content-rules.ts cần DB để chạy (buildContentRules gọi
    # prisma.dataPoint.groupBy), nhưng phần đáng canh nhất của nó — 8 vector qua
    # validator thật, cộng phép đòi bộ vector có cả hai chiều — dùng fact tổng
    # hợp cố định nên không phụ thuộc dữ liệu.
    #
    # Trước ffcd3d5 thì đưa nó vào đây là sai: phép kiểm resolution của chỉ số
    # ĐẠT RỖNG trên DB trống — "✓ 0 chỉ số, mỗi chỉ số đúng resolution" đúng về
    # logic vì nó nói về tập rỗng, và đọc y hệt một phép vừa xác nhận điều gì
    # đó. Một PR xanh sẽ đọc như "đã kiểm resolution" trong khi nó chưa hỏi chỉ
    # số nào. Từ ffcd3d5, script đếm phép đó là KHÔNG KẾT LUẬN ĐƯỢC và rời khỏi
    # cả tử số lẫn mẫu số, nên cổng này nói đúng điều nó kiểm được.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pseo
          POSTGRES_PASSWORD: pseo
          POSTGRES_DB: pseo_control_panel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pseo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pseo:pseo@localhost:5432/pseo_control_panel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Ghim npm khớp VPS
        run: npm i -g npm@11.6.2

      - run: npm ci

      # Cần cho tsc: kiểu của @prisma/client là kiểu SINH RA, không có sẵn
      # trong node_modules sau npm ci. `generate` đọc schema chứ không gọi DB,
      # nên bước này chạy được mà không cần Postgres.
      - name: Prisma client
        run: npx prisma generate

      # Kiểu do Next SINH RA — RouteContext, LayoutProps, PageProps — không có
      # sẵn sau `npm ci`. Chúng ra đời từ `next dev`, `next build` hoặc
      # `next typegen` (docs của chính bản Next này: 01-app/01-getting-started/
      # 03-layouts-and-pages.md). Workflow chính chạy `next build` TRƯỚC tsc,
      # nên ở đó tsc luôn có chúng.
      #
      # Bước này thêm vào sau khi cổng PR đỏ ngay lần chạy đầu, ở đúng chỗ tôi
      # bỏ `next build` đi: 5 lỗi TS2304 "Cannot find name 'RouteContext'". Code
      # không sai — cổng thiếu điều kiện tiên quyết mà nó thừa hưởng từ bước nó
      # vừa bỏ. `typegen` cho lại đúng phần đó mà không cần Postgres, không cần
      # build.
      - name: Kiểu do Next sinh ra
        run: npx next typegen

      - name: Kiểu
        run: npx tsc --noEmit

      # `eslint .`, không phải `eslint <file vừa sửa>`. Chính chỗ này hỏng ở
      # 7e5d191: cổng tại chỗ chạy trên vài file nên xanh, cổng CI chạy toàn
      # repo nên đỏ — một phép kiểm không phủ thứ nó có vẻ phủ.
      - name: Lint
        run: npx eslint .

      # Không mạng, không DB: vector dùng fact tổng hợp cố định. Canh nhiều hơn
      # "vector còn xanh" — đòi mỗi luật còn cả accept lẫn reject, đòi mọi nhánh
      # của vị ngữ có ca chạm tới, và đòi một validator "accept mọi thứ" bị bắt.
      - name: Luật JSON-LD, và bộ vector của chúng còn từ chối được
        run: npx tsx scripts/verify-technical-rules.ts

      # Schema phải có trước khi script chạm Prisma. Không dữ liệu nào được
      # nạp: xem chú thích ở khối `services` về việc DB rỗng kiểm được gì và
      # KHÔNG kiểm được gì.
      - name: Schema DB
        run: npx prisma migrate deploy

      - name: Luật nội dung công bố khớp hành vi thật
        run: npx tsx scripts/verify-content-rules.ts
